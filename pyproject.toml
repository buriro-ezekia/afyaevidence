[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afyaevidence"
version = "0.1.0"
description = "Synthetic aggregate malaria reporting evidence contracts"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
identity = ["PyJWT[crypto]>=2.13.0,<3", "cryptography>=46.0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
