name: Source-access probe

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check deterministic fixture bytes
        run: python scripts/generate_probe.py --check
      - name: Check source contract without JDBC
        run: python scripts/verify_zetaris.py --check-fixture
      - name: Run probe tests without secrets or a JVM
        run: python -m unittest discover -s tests -v
