name: Synthetic contracts and source-access probe

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check deterministic fixture bytes
        run: python scripts/generate_probe.py --check
      - name: Check source contract without JDBC
        run: python scripts/verify_zetaris.py --check-fixture
      - name: Check reproducible monthly snapshots
        run: python scripts/generate_synthetic.py --check
      - name: Evaluate independent scenario answers
        run: python scripts/evaluate_synthetic.py
      - name: Check three-table verifier preflight without JDBC
        run: python scripts/verify_zetaris_snapshot.py --check-fixture
      - name: Build runtime package
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Exclude evaluator keys from runtime package
        run: python scripts/check_runtime_package.py dist/afyaevidence-0.1.0-py3-none-any.whl
      - name: Run contract tests without secrets or a JVM
        run: python -m unittest discover -s tests -v
